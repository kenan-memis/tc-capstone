[project]
name = "capstone-project"
version = "0.1.0"
description = "PlanMyBerlin — LangGraph Berlin trip planner (Turing AI Engineering Capstone)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.3.0",
    "langgraph>=1.1.8",
    "pydantic>=2.13.2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.56.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]

[project.scripts]
planmyberlin-export-graphs = "planmyberlin.cli.export_graphs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["planmyberlin"]

[tool.hatch.build.targets.wheel.force-include]
"planmyberlin/config/settings.yaml" = "planmyberlin/config/settings.yaml"
"planmyberlin/config/constants.yaml" = "planmyberlin/config/constants.yaml"
"planmyberlin/prompts/prompts.yaml" = "planmyberlin/prompts/prompts.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["planmyberlin", "tests", "scripts"]

[tool.ruff.lint]
select = ["F", "E9"]
