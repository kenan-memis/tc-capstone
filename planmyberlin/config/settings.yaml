# Runtime tunables (models, Streamlit chrome). Extend as the app grows.

page_title: PlanMyBerlin
page_icon: 🗺️
layout: wide

models:
  openai_default: gpt-4o-mini

retrieval:
  # auto: use chroma if index exists, else seed fallback
  # chroma: require chroma index (raise if unavailable)
  # seed: deterministic metadata retriever only
  backend: auto
  seed_limit: 36
  chroma_persist_dir: data/vectorstore/chroma
  chroma_collection: berlin_seed_v1
  chroma_force_rebuild: false
  # If neighbourhoods are selected, keep results area-faithful first.
  strict_area_filter: true
  strict_min_items: 4
  nearby_fallback: true
  food_interest_guarantee: true
  food_interest_min_items: 2

places:
  backend: google_places
  city: Berlin
  timeout_seconds: 8
  max_items: 24

weather:
  city: Berlin
  units: metric
  timeout_seconds: 8

events:
  backend: kulturdaten
  city: Berlin
  # Production discover API lives on api-v2 (see api-v2.kulturdaten.berlin/api/docs).
  base_url: https://api-v2.kulturdaten.berlin
  timeout_seconds: 8
  max_items: 4

transport:
  backend: bvg_rest
  city: Berlin
  timeout_seconds: 8
  base_url: https://v6.bvg.transport.rest
  max_queries: 6
  results_per_query: 2
  nearby_results: 2

accommodation:
  backend: google_places
  max_items: 4

itinerary:
  model: gpt-4o-mini
  temperature: 0.4
  grounding_repair: true
  # Keep the UI smooth: default to rendering structured itinerary directly.
  narrative_stream: false
  # Agent-style tool phase before structured itinerary JSON (LangChain bind_tools).
  tool_use: true
  tool_max_rounds: 6

# Logging: stderr; optional JSON lines for aggregators (e.g. Cloud Logging).
observability:
  log_level: INFO
  json_logs: false

profiles:
  sqlite_path: data/app/profiles.db
