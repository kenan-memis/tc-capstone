# Runtime tunables (models, Streamlit chrome). Extend as the app grows.

page_title: PlanMyBerlin
page_icon: 🗺️
layout: wide

models:
  openai_default: gpt-4o-mini

retrieval:
  # auto: use chroma if index exists, else seed fallback
  # chroma: require chroma index (raise if unavailable)
  # seed: deterministic metadata retriever only
  backend: auto
  seed_limit: 8
  chroma_persist_dir: data/vectorstore/chroma
  chroma_collection: berlin_seed_v1
  chroma_force_rebuild: false

places:
  backend: google_places
  city: Berlin
  timeout_seconds: 8
  max_items: 6

weather:
  city: Berlin
  units: metric
  timeout_seconds: 8

transport:
  backend: bvg_rest
  city: Berlin
  timeout_seconds: 8
  base_url: https://v6.bvg.transport.rest
  max_queries: 3
  results_per_query: 2
  nearby_results: 2

accommodation:
  backend: curated
  max_items: 4

itinerary:
  model: gpt-4o-mini
  temperature: 0.4
  grounding_repair: true

# Logging: stderr; optional JSON lines for aggregators (e.g. Cloud Logging).
observability:
  log_level: INFO
  json_logs: false
